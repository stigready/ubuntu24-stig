- name: Product hardening | Disable core dumps for SUID programs (fs.suid_dumpable)
  ansible.posix.sysctl:
    name: fs.suid_dumpable
    value: '0'
    sysctl_file: /etc/sysctl.d/91-stigready-product.conf
    sysctl_set: true
    reload: true
    state: present
  tags:
  - low_disruption
  - no_reboot_needed
- name: Product hardening | Remove apport (nothing re-enables suid core dumps at boot)
  ansible.builtin.package:
    name: apport
    state: absent
  tags:
  - low_disruption
  - no_reboot_needed
