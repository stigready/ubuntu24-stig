# StigForge supplements for Ubuntu 24.04 STIG - not overwritten by `stigforge generate`.
# Every rule below has NO ansible remediation in ComplianceAsCode/content 0.1.82's
# ubuntu2404-playbook-stig.yml (confirmed by regenerating the fix directly from the
# datastream with `oscap xccdf generate fix`, not just the pre-built release zip) -
# these are genuine upstream SSG coverage gaps for this product, not StigForge filtering.
# Target values below are the "stig" profile's own <xccdf:refine-value> selections (or
# the Value element's unselected default when the stig profile doesn't refine it) read
# directly out of ssg-ubuntu2404-ds.xml - not invented.

- name: StigForge supplement - set PASS_MAX_DAYS in /etc/login.defs (accounts_maximum_age_login_defs)
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^\s*PASS_MAX_DAYS\s+'
    line: "PASS_MAX_DAYS   60"
    state: present
  tags:
    - accounts_maximum_age_login_defs

- name: StigForge supplement - set PASS_MIN_DAYS in /etc/login.defs (accounts_minimum_age_login_defs)
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^\s*PASS_MIN_DAYS\s+'
    line: "PASS_MIN_DAYS   1"
    state: present
  tags:
    - accounts_minimum_age_login_defs

- name: StigForge supplement - set INACTIVE in /etc/default/useradd (account_disable_post_pw_expiration)
  ansible.builtin.lineinfile:
    path: /etc/default/useradd
    regexp: '^\s*#?\s*INACTIVE='
    line: "INACTIVE=35"
    state: present
    create: true
  tags:
    - account_disable_post_pw_expiration

- name: StigForge supplement - check for a maxlogins limits.d fragment (accounts_max_concurrent_login_sessions)
  ansible.builtin.stat:
    path: /etc/security/limits.d
  register: stigforge_limits_d
  tags:
    - accounts_max_concurrent_login_sessions

- name: StigForge supplement - cap concurrent login sessions per account (accounts_max_concurrent_login_sessions)
  ansible.builtin.lineinfile:
    path: "{{ '/etc/security/limits.d/99-stigforge-maxlogins.conf' if stigforge_limits_d.stat.exists else '/etc/security/limits.conf' }}"
    regexp: '^\*\s+hard\s+maxlogins\s+'
    line: "*               hard    maxlogins       10"
    state: present
    create: true
  tags:
    - accounts_max_concurrent_login_sessions

- name: StigForge supplement - check the presence of /etc/security/faillock.conf (deny/interval/unlock_time)
  ansible.builtin.stat:
    path: /etc/security/faillock.conf
  register: stigforge_faillock_conf
  when: '"libpam-runtime" in ansible_facts.packages'
  tags:
    - accounts_passwords_pam_faillock_deny
    - accounts_passwords_pam_faillock_interval
    - accounts_passwords_pam_faillock_unlock_time

- name: StigForge supplement - set faillock deny threshold (accounts_passwords_pam_faillock_deny)
  ansible.builtin.lineinfile:
    path: /etc/security/faillock.conf
    regexp: '^\s*deny\s*='
    line: "deny = 3"
    state: present
  when:
    - '"libpam-runtime" in ansible_facts.packages'
    - stigforge_faillock_conf is not skipped and stigforge_faillock_conf.stat.exists
  tags:
    - accounts_passwords_pam_faillock_deny

- name: StigForge supplement - set faillock fail_interval (accounts_passwords_pam_faillock_interval)
  ansible.builtin.lineinfile:
    path: /etc/security/faillock.conf
    regexp: '^\s*fail_interval\s*='
    line: "fail_interval = 900"
    state: present
  when:
    - '"libpam-runtime" in ansible_facts.packages'
    - stigforge_faillock_conf is not skipped and stigforge_faillock_conf.stat.exists
  tags:
    - accounts_passwords_pam_faillock_interval

- name: StigForge supplement - set faillock unlock_time (accounts_passwords_pam_faillock_unlock_time)
  ansible.builtin.lineinfile:
    path: /etc/security/faillock.conf
    regexp: '^\s*unlock_time\s*='
    line: "unlock_time = 0"
    state: present
  when:
    - '"libpam-runtime" in ansible_facts.packages'
    - stigforge_faillock_conf is not skipped and stigforge_faillock_conf.stat.exists
  tags:
    - accounts_passwords_pam_faillock_unlock_time

- name: StigForge supplement - add pam_faildelay delay to /etc/pam.d/common-auth (accounts_passwords_pam_faildelay_delay)
  ansible.builtin.lineinfile:
    path: /etc/pam.d/common-auth
    regexp: '^\s*auth\s+\S+\s+pam_faildelay\.so'
    line: "auth        required                        pam_faildelay.so delay=4000000"
    state: present
    insertbefore: BOF
  when: '"libpam-runtime" in ansible_facts.packages'
  tags:
    - accounts_passwords_pam_faildelay_delay

# The success=N jump depends on which pam-auth-update profiles are enabled (success=1 stock, success=2 once pam_pwhistory is in the
# stack), so match any N and rewrite only the algorithm token. A regexp pinned to success=1 matched nothing on the built image and
# lineinfile appended a SECOND pam_unix line (ubuntu-24.04:stig 2026-10-14), which the OVAL ("specified only once") rejects.
- name: StigForge supplement - use sha512 + rounds for pam_unix.so password hashing (set_password_hashing_algorithm_auth_stig, accounts_password_pam_unix_rounds_password_auth)
  ansible.builtin.replace:
    path: /etc/pam.d/common-password
    regexp: '^(password\s+\[success=\d+\s+default=ignore\]\s+pam_unix\.so\b.*?)\byescrypt\b(.*)$'
    replace: '\1sha512 rounds=100000\2'
  when: '"libpam-runtime" in ansible_facts.packages'
  tags:
    - set_password_hashing_algorithm_auth_stig
    - accounts_password_pam_unix_rounds_password_auth

- name: StigForge supplement - notify last login attempts including failures (display_login_attempts)
  ansible.builtin.lineinfile:
    path: /etc/pam.d/login
    regexp: '^\s*session\s+\S+\s+pam_lastlog\.so\b.*$'
    line: "session    required   pam_lastlog.so showfailed"
    state: present
  tags:
    - display_login_attempts

# OVAL check (oval:ssg-test_remove_unused_dependencies/kernel_packages) scans
# /etc/apt/apt.conf* for Unattended-Upgrade::Remove-Unused-* - not APT::Get::* as
# the human-readable rule description implies; confirmed by reading the datastream's
# textfilecontent54_object pattern directly rather than guessing from prose.
- name: StigForge supplement - configure apt to remove unused dependencies and kernels after upgrade (clean_components_post_updating)
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    create: true
  loop:
    - regexp: '^\s*Unattended-Upgrade::Remove-Unused-Dependencies\b'
      line: 'Unattended-Upgrade::Remove-Unused-Dependencies "true";'
    - regexp: '^\s*Unattended-Upgrade::Remove-Unused-Kernel-Packages\b'
      line: 'Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";'
  loop_control:
    label: "{{ item.line }}"
  tags:
    - clean_components_post_updating

# file_groupowner_var_log's OVAL check (oval:ssg-file_groupowner_var_log:def:1) requires
# /var/log/ group-owned specifically by "syslog" - unlike its sibling rule
# file_groupowner_var_log_syslog (for /var/log/syslog the *file*), which accepts
# adm or root as a fallback. Upstream's own remediation for this rule only sets
# file_groupowner_var_log_newgroup when the "syslog" group already exists (via
# getent), so on a minimal container image without rsyslog installed it leaves the
# var undefined and /var/log/ ownership untouched. The correct fix is to ensure the
# "syslog" system group exists (as it would on any real Ubuntu 24.04 host with
# rsyslog/syslog infra installed) rather than substitute a different group the
# check doesn't accept.
- name: StigForge supplement - ensure the syslog system group exists (file_groupowner_var_log)
  ansible.builtin.group:
    name: syslog
    system: true
    state: present
  tags:
    - file_groupowner_var_log

# NOTE (tracked, not silently dropped): banner_etc_profiled_ssh_confirm's OVAL check
# compiles the `var_ssh_confirm_text` Value directly as a PCRE pattern-match against
# /etc/profile.d/*.sh. Confirmed via `oscap xccdf generate fix --fix-type bash` against
# ssg-ubuntu2404-ds.xml (0.1.82) that upstream's OWN bash fix template is broken: its
# step-2 `sed 's/(?:\[\\n\]+|(?:\\n)+)/\n/g'` never matches the Value's actual escaping
# (GNU sed on the same base image leaves literal `(?:[n]+|(?:n)+)` tokens in the
# generated /etc/profile.d/ssh_confirm.sh - i.e. running ComplianceAsCode's own
# remediation produces a banner that fails its own check). This is an upstream
# ComplianceAsCode/content defect, not a StigForge gap; we still install a correct,
# human-readable banner below (real security value) rather than skip it, but do not
# claim a compliance PASS we can't verify - do not hand-craft content solely to satisfy
# the raw regex without a local oscap re-scan proving the match, per repo policy against
# faking green.
- name: StigForge supplement - install the SSH login confirmation banner script (banner_etc_profiled_ssh_confirm)
  ansible.builtin.copy:
    dest: /etc/profile.d/ssh_confirm.sh
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/bash

      if [ -n "$SSH_CLIENT" ] || [ -n "$SSH_TTY" ]; then
              while true; do
                      read -p "

      You are accessing a U.S. Government (USG) Information System (IS) that is provided for
      USG-authorized use only.

      By using this IS (which includes any device attached to this IS), you consent to the
      following conditions:

      -The USG routinely intercepts and monitors communications on this IS for purposes
      including, but not limited to, penetration testing, COMSEC monitoring, network
      operations and defense, personnel misconduct (PM), law enforcement (LE), and
      counterintelligence (CI) investigations.

      -At any time, the USG may inspect and seize data stored on this IS.

      -Communications using, or data stored on, this IS are not private, are subject to routine
      monitoring, interception, and search, and may be disclosed or used for any USG-authorized
      purpose.

      -This IS includes security measures (e.g., authentication and access controls) to protect
      USG interests--not for your personal benefit or privacy.

      -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI
      investigative searching or monitoring of the content of privileged communications, or
      work product, related to personal representation or services by attorneys,
      psychotherapists, or clergy, and their assistants. Such communications and work product
      are private and confidential. See User Agreement for details.

      Do you agree? [y/N] " yn
                      case $yn in
                              [Yy]* ) break ;;
                              [Nn]* ) exit 1 ;;
                      esac
              done
      fi
  tags:
    - banner_etc_profiled_ssh_confirm

- name: StigForge supplement - ensure group owner on /var/log/ is syslog (file_groupowner_var_log)
  ansible.builtin.file:
    path: /var/log/
    follow: false
    state: directory
    group: syslog
  tags:
    - file_groupowner_var_log

# ---------------------------------------------------------------------------------------
# Beyond-benchmark product hardening, moved out of the factory (decision 0021: StigForge
# roles own ALL hardening).
#
# These are NOT required by this profile. Verified against the SSG datastream:
#   - kernel_module_{dccp,freevxfs,hfs,hfsplus,jffs2,udf}_disabled are CIS rules, not STIG.
#     Only cramfs (RHEL-09-231195), sctp (RHEL-09-213060) and tipc (RHEL-09-213065) are in
#     the stig profile. On Ubuntu NONE of the nine are.
#   - sysctl_fs_suid_dumpable is in anssi/ccn/hipaa/pci-dss on RHEL and CIS on Ubuntu -
#     in neither the RHEL stig nor the RHEL cis profile.
#
# StigReady applies them to every hardened image anyway: CIS-grade module blacklisting and
# suid-dump hardening on a STIG image costs nothing at runtime and is strictly safer. That
# is a PRODUCT decision, which is why it lives in the role rather than being argued as a
# benchmark requirement.
#
# Tagged DISA/CCE only where a real identifier exists. The rest carry no rule-id tag on
# purpose - the generator derives a toggle from an SSG rule-id tag, and a product decision
# is not a per-rule opt-out. Idempotent: harmless where the profile already covers a module.
- name: Product hardening | Ensure kernel module 'cramfs' is disabled
  ansible.builtin.copy:
    dest: /etc/modprobe.d/cramfs.conf
    owner: root
    group: root
    mode: '0644'
    content: 'install cramfs /bin/true

      blacklist cramfs

      '
  tags:
  - low_disruption
  - no_reboot_needed
- name: Product hardening | Ensure kernel module 'dccp' is disabled
  ansible.builtin.copy:
    dest: /etc/modprobe.d/dccp.conf
    owner: root
    group: root
    mode: '0644'
    content: 'install dccp /bin/true

      blacklist dccp

      '
  tags:
  - low_disruption
  - no_reboot_needed
- name: Product hardening | Ensure kernel module 'freevxfs' is disabled
  ansible.builtin.copy:
    dest: /etc/modprobe.d/freevxfs.conf
    owner: root
    group: root
    mode: '0644'
    content: 'install freevxfs /bin/true

      blacklist freevxfs

      '
  tags:
  - low_disruption
  - no_reboot_needed
- name: Product hardening | Ensure kernel module 'hfs' is disabled
  ansible.builtin.copy:
    dest: /etc/modprobe.d/hfs.conf
    owner: root
    group: root
    mode: '0644'
    content: 'install hfs /bin/true

      blacklist hfs

      '
  tags:
  - low_disruption
  - no_reboot_needed
- name: Product hardening | Ensure kernel module 'hfsplus' is disabled
  ansible.builtin.copy:
    dest: /etc/modprobe.d/hfsplus.conf
    owner: root
    group: root
    mode: '0644'
    content: 'install hfsplus /bin/true

      blacklist hfsplus

      '
  tags:
  - low_disruption
  - no_reboot_needed
- name: Product hardening | Ensure kernel module 'jffs2' is disabled
  ansible.builtin.copy:
    dest: /etc/modprobe.d/jffs2.conf
    owner: root
    group: root
    mode: '0644'
    content: 'install jffs2 /bin/true

      blacklist jffs2

      '
  tags:
  - low_disruption
  - no_reboot_needed
- name: Product hardening | Ensure kernel module 'sctp' is disabled
  ansible.builtin.copy:
    dest: /etc/modprobe.d/sctp.conf
    owner: root
    group: root
    mode: '0644'
    content: 'install sctp /bin/true

      blacklist sctp

      '
  tags:
  - low_disruption
  - no_reboot_needed
- name: Product hardening | Ensure kernel module 'tipc' is disabled
  ansible.builtin.copy:
    dest: /etc/modprobe.d/tipc.conf
    owner: root
    group: root
    mode: '0644'
    content: 'install tipc /bin/true

      blacklist tipc

      '
  tags:
  - low_disruption
  - no_reboot_needed
- name: Product hardening | Ensure kernel module 'udf' is disabled
  ansible.builtin.copy:
    dest: /etc/modprobe.d/udf.conf
    owner: root
    group: root
    mode: '0644'
    content: 'install udf /bin/true

      blacklist udf

      '
  tags:
  - low_disruption
  - no_reboot_needed
- name: Product hardening | Disable core dumps for SUID programs (fs.suid_dumpable)
  ansible.posix.sysctl:
    name: fs.suid_dumpable
    value: '0'
    sysctl_file: /etc/sysctl.d/91-stigready-product.conf
    sysctl_set: true
    reload: true
    state: present
  tags:
  - low_disruption
  - no_reboot_needed
- name: Product hardening | Remove apport (nothing re-enables suid core dumps at boot)
  ansible.builtin.package:
    name: apport
    state: absent
  tags:
  - low_disruption
  - no_reboot_needed

# ---- 2026-10-14 ubuntu-24.04:stig prove-out (OpenSCAP 86.8%, 18 non-exempt failures, 3 rescued fatals). Values come from the
# STIG profile's own variables and OVAL states (ARF), not from memory.

# accounts_tmout (profile value 600). The generated tasks only correct an existing TMOUT and none existed.
- name: Define a read-only TMOUT for login shells (accounts_tmout)
  ansible.builtin.copy:
    dest: /etc/profile.d/tmout.sh
    owner: root
    group: root
    mode: "0644"
    content: |
      # StigReady: terminate an idle login shell (accounts_tmout)
      TMOUT={{ var_accounts_tmout | default('600') }}
      readonly TMOUT
      export TMOUT
  tags:
    - accounts_tmout

# grub2_audit_argument: audit=1 on the kernel command line (the cis supplement does the same).
- name: Enable auditing from boot on the kernel command line - audit=1 (grub2_audit_argument)
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX=")(?!(?:[^"]*\s)?audit=1(?:\s|"))([^"]*)"$'
    line: '\1\2 audit=1"'
    backrefs: true
  register: stigforge_stig_grub_audit
  tags:
    - grub2_audit_argument

- name: Regenerate the GRUB configuration after the audit change (grub2_audit_argument)
  ansible.builtin.command: update-grub
  when: stigforge_stig_grub_audit is changed
  changed_when: true
  tags:
    - grub2_audit_argument

# auditd_data_retention_space_left_action (profile value email) and the audit log ownership/permissions the STIG variants test.
- name: Configure auditd.conf space_left_action and log group (auditd_data_retention_space_left_action)
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^\s*#?\s*{{ item.key }}\s*='
    line: '{{ item.key }} = {{ item.value }}'
  loop:
    - {key: space_left_action, value: email}
    - {key: action_mail_acct, value: root}
    - {key: log_group, value: root}
  loop_control:
    label: '{{ item.key }}'
  register: stigforge_stig_auditd_conf
  tags:
    - auditd_data_retention_space_left_action

# auditd reads log_group only when it starts; the running daemon still has Ubuntu's default (adm), so a log it rotates later
# (max_log_file = 8 MB) is created root:adm 0640 after the permission tasks below have run. Restart it first so every file it
# creates from now on is root:root 0600, then normalise what already exists (same defect as ubuntu-24.04:cis-l2, 2026-10-14).
- name: Restart auditd so it creates logs with the new log_group (file_group_ownership_var_log_audit_stig)
  ansible.builtin.service:
    name: auditd
    state: restarted
  when: stigforge_stig_auditd_conf is changed
  tags:
    - file_permissions_var_log_audit_stig
    - file_group_ownership_var_log_audit_stig

- name: Make /var/log/audit private to root (file_permissions_var_log_audit_stig)
  ansible.builtin.file:
    path: /var/log/audit
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags:
    - file_permissions_var_log_audit_stig
    - file_group_ownership_var_log_audit_stig

- name: Find the audit log files
  ansible.builtin.find:
    paths: /var/log/audit
    patterns: 'audit.log*'
    file_type: file
  register: stigforge_stig_audit_logs
  tags:
    - file_permissions_var_log_audit_stig

- name: Make the audit log files root:root 0600 (file_permissions_var_log_audit_stig)
  ansible.builtin.file:
    path: '{{ item.path }}'
    owner: root
    group: root
    mode: "0600"
  loop: '{{ stigforge_stig_audit_logs.files | default([]) }}'
  loop_control:
    label: '{{ item.path }}'
  tags:
    - file_permissions_var_log_audit_stig
    - file_group_ownership_var_log_audit_stig

# audit_rules_privileged_commands_modprobe (UBTU-24-900730): "-w /sbin/modprobe -p x -k modules".
- name: Audit the use of modprobe (audit_rules_privileged_commands_modprobe)
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/50-stigready-modprobe.rules
    owner: root
    group: root
    mode: "0600"
    content: |
      -w /sbin/modprobe -p x -k modules
  register: stigforge_stig_modprobe_rule
  tags:
    - audit_rules_privileged_commands_modprobe

# The generated audit_rules_immutable task writes -e 2 and a later generated task runs augenrules --load, so by now the kernel
# audit configuration is locked and a further load exits 1 with no output (ubuntu-24.04:stig 2026-10-14). The rule file is on
# disk and is loaded at boot; only that one case is skipped, any other augenrules failure still fails the task.
- name: Load the audit rules unless the audit configuration is already immutable (audit_rules_privileged_commands_modprobe)
  ansible.builtin.shell: |
    set -eu
    if auditctl -s | grep -q '^enabled 2'; then
      echo "audit configuration is immutable; the rule loads at boot"
      exit 0
    fi
    augenrules --load
  args:
    executable: /bin/bash
  register: stigforge_stig_audit_load
  when: stigforge_stig_modprobe_rule is changed
  changed_when: "'immutable' not in stigforge_stig_audit_load.stdout"
  tags:
    - audit_rules_privileged_commands_modprobe

# dir_permissions_system_journal (UBTU-24-700020): /run/log/journal and /var/log/journal must be 2750 or less. systemd's own
# tmpfiles.d recreates them 2755 at every boot, so the change must be a tmpfiles override, not just a chmod now.
- name: Override the systemd tmpfiles journal modes (dir_permissions_system_journal)
  ansible.builtin.copy:
    src: /usr/lib/tmpfiles.d/systemd.conf
    dest: /etc/tmpfiles.d/systemd.conf
    remote_src: true
    owner: root
    group: root
    mode: "0644"
    force: false
  tags:
    - dir_permissions_system_journal

- name: Set the journal directory mode to 2750 in the tmpfiles override (dir_permissions_system_journal)
  ansible.builtin.replace:
    path: /etc/tmpfiles.d/systemd.conf
    regexp: '^(z\s+/(?:run|var)/log/journal(?:/%m)?\s+)2755(\s)'
    replace: '\g<1>2750\2'
  register: stigforge_stig_journal_tmpfiles
  tags:
    - dir_permissions_system_journal

- name: Apply the journal modes now (dir_permissions_system_journal)
  ansible.builtin.command: systemd-tmpfiles --create --prefix=/run/log/journal --prefix=/var/log/journal
  when: stigforge_stig_journal_tmpfiles is changed
  changed_when: true
  tags:
    - dir_permissions_system_journal

# chronyd_server_directive / chronyd_specify_remote_server: chrony is installed, but Ubuntu's default config carries only `pool`
# lines. Use the Amazon Time Sync Service, the AWS-recommended source reachable from every VPC.
- name: Remove the public pool time sources (chronyd_server_directive)
  ansible.builtin.lineinfile:
    path: /etc/chrony/chrony.conf
    regexp: '^\s*pool\s'
    state: absent
  tags:
    - chronyd_server_directive

- name: Configure the Amazon Time Sync Service as a chrony server (chronyd_server_directive, chronyd_specify_remote_server)
  ansible.builtin.lineinfile:
    path: /etc/chrony/chrony.conf
    regexp: '^\s*server\s'
    line: 'server 169.254.169.123 prefer iburst minpoll 4 maxpoll 4'
    insertbefore: '^\s*confdir\s'
    firstmatch: true
  tags:
    - chronyd_server_directive
    - chronyd_specify_remote_server

# sshd_use_approved_{ciphers,kex,macs}_ordered_stig: the OVAL compares the value to these exact strings, in EVERY file under
# sshd_config.d (ubuntu-24.04:stig 2026-10-14: 05-stigready-crypto.conf passed, the generated 00-complianceascode-hardening.conf
# carried SSG's literal Kex list and a different MAC order, and failed the rule). stig-pre.yml sets sshd_approved_ciphers and
# sshd_approved_macs so the generated tasks write the STIG values themselves (their default Ciphers list holds 3des-cbc and
# rijndael-cbc@lysator.liu.se, which this OpenSSH rejects: "Bad SSH2 cipher spec"); KexAlgorithms is a literal in the generated
# task, so it is corrected here. This drop-in stays as the single statement of the values and sorts before 10-stigready.conf.
- name: Set the STIG-approved ordered sshd key exchange in the generated drop-in (sshd_use_approved_kex_ordered_stig)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config.d/00-complianceascode-hardening.conf
    regexp: '(?i)^\s*KexAlgorithms\s+'
    line: 'KexAlgorithms ecdh-sha2-nistp521,ecdh-sha2-nistp384,ecdh-sha2-nistp256,diffie-hellman-group-exchange-sha256,diffie-hellman-group16-sha512,diffie-hellman-group14-sha256'
  tags:
    - sshd_use_approved_kex_ordered_stig

- name: Set the STIG-approved ordered sshd ciphers, key exchange and MACs
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/05-stigready-crypto.conf
    owner: root
    group: root
    mode: "0600"
    content: |
      Ciphers aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes128-ctr
      KexAlgorithms ecdh-sha2-nistp521,ecdh-sha2-nistp384,ecdh-sha2-nistp256,diffie-hellman-group-exchange-sha256,diffie-hellman-group16-sha512,diffie-hellman-group14-sha256
      MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256
    validate: /usr/sbin/sshd -t -f %s
  tags:
    - sshd_approved_crypto_stigready
