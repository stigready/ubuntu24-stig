# StigForge-owned prerequisite for the generated file_groupowner_var_log rule, run BEFORE the generated body.
#
# The generated "Ensure group owner on /var/log/" task builds its group variable from a getent lookup of the `syslog` group
# and aborts ("'file_groupowner_var_log_newgroup' is undefined", ubuntu-24.04:stig 2026-10-14, one rescued fatal) when the
# group does not exist yet. The supplement created it AFTER the body, too late. Create it first; the later task is idempotent.
---
- name: Ensure the syslog system group exists before the generated var/log ownership task
  ansible.builtin.group:
    name: syslog
    system: true
    state: present
  tags:
    - file_groupowner_var_log
    - high_severity

# The generated sshd tasks write these two variables into /etc/ssh/sshd_config.d/00-complianceascode-hardening.conf. Their role
# defaults are SSG's generic lists: the cipher list contains 3des-cbc and rijndael-cbc@lysator.liu.se (sshd -t: "Bad SSH2 cipher
# spec", a rescued fatal that fails the build review) and the MAC list is in the wrong order for the *_ordered_stig OVAL. set_fact
# outranks role defaults, so the generated tasks write the STIG values themselves. Values are the strings the OVAL states compare.
- name: Use the STIG-approved ordered sshd cipher and MAC lists in the generated tasks
  ansible.builtin.set_fact:
    sshd_approved_ciphers: aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes128-ctr
    sshd_approved_macs: hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256
  tags:
    - sshd_use_approved_ciphers_ordered_stig
    - sshd_use_approved_macs_ordered_stig
